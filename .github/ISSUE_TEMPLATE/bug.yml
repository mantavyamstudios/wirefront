name: Bug report
description: Something in a screen, the registry or the site is broken.
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: Screen URL or registry item, for example /c/tables/members or @wirefront/tables-members.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and OS, viewport or device, and for installs your framework (Next.js, TanStack Start, Vite…).
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
