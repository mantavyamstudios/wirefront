name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels an older pull request run. Runs on main are never
# cancelled, so a deploy is never stopped halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, licence headers, tests, build, bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run spdx:check
      - run: bun run test
      - run: bun run build
      - name: Per-screen bundle budget (gzipped size vs bundle-budget.json)
        run: bun run test:bundle

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      # Errors fail these steps; warnings are reported and never fail them.
      - name: Lint gate (fails on any new lint error)
        run: bun run lint:gate
      - name: Full lint, runtime and packages (fails on lint errors)
        run: bun run lint
      - name: Site lint and format, Ultracite (fails on lint errors or unformatted files)
        run: bun run --cwd apps/www lint
      - name: Shell lint and format, Ultracite (fails on lint errors or unformatted files)
        run: bun run --cwd packages/shell-ui lint

  install:
    name: Install into fresh Next.js, Vite and TanStack Start apps
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run test:install

  browser:
    name: Browser check (runtime errors, hydration, accessibility)
    # Playwright 1.59 has no Chromium build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    # A stalled step fails the job instead of holding it for six hours.
    timeout-minutes: 45
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: bash scripts/ci-install-chromium.sh
      - run: bun run test:browser
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-report
          path: .audit/browser/report.json
          if-no-files-found: warn

  responsive:
    name: Responsive audit
    # Playwright 1.59 has no Chromium build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    # A stalled step fails the job instead of holding it for six hours.
    timeout-minutes: 45
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: bash scripts/ci-install-chromium.sh
      - run: bun run audit:responsive -- --strict
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: responsive-report
          path: .audit/responsive/report.json
          if-no-files-found: warn

  site:
    name: Site (screens manifest, bridge, screen docs, built site in a browser)
    # Playwright 1.59 has no Chromium build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    # A stalled step fails the job instead of holding it for six hours.
    timeout-minutes: 45
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Screens manifest matches the catalogue
        run: bun run --cwd apps/www screens:check
      - name: Install Chromium for Playwright
        run: bash scripts/ci-install-chromium.sh
      - run: bun run test:bridge
      - run: bun run build
      - name: Every screen's usage example typechecks against the screen
        run: bun run --cwd apps/www screens:docs --check
      - name: Built site, served by wrangler, in a browser
        run: bun run test:site

  # Deploys only after every check above has passed. Pushes to main go to
  # production; pull requests from this repository get a Preview (fork pull
  # requests get no secrets, so they are checked but never deployed).
  # README "Deployment" covers the secrets and the one-time Cloudflare setup.
  deploy:
    name: Deploy to Cloudflare Workers
    needs: [checks, lint, install, browser, responsive, site]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Check the deploy settings
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing secret CLOUDFLARE_API_TOKEN,"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing secret CLOUDFLARE_ACCOUNT_ID,"
          [ -n "$VITE_SITE_URL" ] || missing="$missing variable VITE_SITE_URL,"
          if [ -n "$missing" ]; then
            echo "::error title=Deploy settings missing::Add${missing%,} under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Deploy to production
        if: github.event_name == 'push'
        run: |
          bunx wrangler deploy --message "${GITHUB_SHA::7}"
          echo "Deployed ${GITHUB_SHA::7} to $VITE_SITE_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy a Preview
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          # tee, not a redirect: wrangler's output, errors included, stays in the log.
          set -o pipefail
          bunx wrangler preview --name "$PREVIEW_NAME" --message "${GITHUB_SHA::7}" --json | tee preview.json
          {
            echo "Preview $PREVIEW_NAME:"
            jq -r '.. | strings | select(startswith("https://"))' preview.json | sort -u
          } >> "$GITHUB_STEP_SUMMARY"
