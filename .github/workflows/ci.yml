name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, licence headers, tests, build, bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run spdx:check
      - run: bun run test
      - run: bun run build
      - name: Per-screen bundle budget (gzipped size vs bundle-budget.json)
        run: bun run test:bundle

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Lint gate (fails on any new lint problem)
        run: bun run lint:gate
      - name: Full lint report (existing debt, tracked in lint-baseline.json)
        if: always()
        continue-on-error: true
        run: bun run lint

  install:
    name: Install into fresh Next.js, Vite and TanStack Start apps
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run test:install

  browser:
    name: Browser check (runtime errors, hydration, accessibility)
    # Playwright 1.59 has no Chromium build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: bun run test:browser
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-report
          path: .audit/browser/report.json
          if-no-files-found: warn

  responsive:
    name: Responsive audit
    # Playwright 1.59 has no Chromium build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: bun run audit:responsive -- --strict
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: responsive-report
          path: .audit/responsive/report.json
          if-no-files-found: warn

  site:
    name: Site (screens manifest, bridge, built site in a browser)
    # Playwright 1.59 has no Chromium build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Screens manifest matches the catalogue
        run: bun run --cwd apps/www screens:check
      - run: npx playwright install --with-deps chromium
      - run: bun run test:bridge
      - run: bun run build
      - name: Built site, served by wrangler, in a browser
        run: bun run test:site
