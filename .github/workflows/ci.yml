name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, licence headers, tests, build, bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run spdx:check
      - run: npm test
      - run: npm run build
      - name: Per-screen bundle budget (gzipped size vs bundle-budget.json)
        run: npm run test:bundle

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint gate (fails on any new lint problem)
        run: npm run lint:gate
      - name: Full lint report (existing debt, tracked in lint-baseline.json)
        if: always()
        continue-on-error: true
        run: npm run lint

  install:
    name: Install into fresh Next.js, Vite and TanStack Start apps
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:install

  browser:
    name: Browser check (runtime errors, hydration, accessibility)
    # Playwright 1.59 has no Chromium build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-report
          path: .audit/browser/report.json
          if-no-files-found: warn

  responsive:
    name: Responsive audit
    # Playwright 1.59 has no Chromium build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run audit:responsive -- --strict
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: responsive-report
          path: .audit/responsive/report.json
          if-no-files-found: warn
