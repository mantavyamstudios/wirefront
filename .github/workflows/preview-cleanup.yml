name: Preview cleanup

# Deletes a pull request's Cloudflare Preview once the pull request is closed
# or merged. CI creates it as pr-<number> (ci.yml, deploy job).
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete:
    name: Delete the pull request's Preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      # A pull request that never deployed (failed checks, or opened before
      # deploys existed) has no Preview: that is reported as a warning, not
      # an error. Any other failure fails the job.
      - name: Delete the Preview
        run: |
          if out=$(bunx wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation 2>&1); then
            echo "$out"
          elif printf '%s' "$out" | grep -qi "not found\|does not exist"; then
            echo "::warning title=No Preview to delete::$PREVIEW_NAME was never deployed."
          else
            echo "$out"
            exit 1
          fi
